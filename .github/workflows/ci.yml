name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Run API smoke test
        run: npm run smoke

      - name: Run hk checks
        run: hk check --all
